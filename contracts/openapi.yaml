openapi: 3.1.0
info:
  title: LabBank S4-RSK (Risk & Fraud Decisioning) API
  version: 1.0.0
  description: Real-time transaction risk evaluation, dynamic rule engine, blocklist,
    and manual review service.
paths:
  /api/v1/risk-rules:
    get:
      operationId: risk_rules_list
      description: List stored rule configuration, including disabled and future rules.
        Requires the manager group; this endpoint does not evaluate rules.
      parameters:
      - in: header
        name: X-Correlation-ID
        schema:
          type: string
        description: Optional request trace identifier; generated when absent.
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: Trace identifier for this response and its logs.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRiskRuleList'
          description: ''
        '403':
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: Trace identifier for this response and its logs.
              required: true
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: Trace identifier for this response and its logs.
              required: true
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /health:
    get:
      operationId: health_retrieve
      description: 'GEN-10: Reports process liveness.'
      parameters:
      - in: header
        name: X-Correlation-ID
        schema:
          type: string
        description: Optional request trace identifier; generated when absent.
      tags:
      - health
      responses:
        '200':
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: Trace identifier for this response and its logs.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /ready:
    get:
      operationId: ready_retrieve
      description: 'GEN-10: Reports readiness of dependencies (PostgreSQL database).'
      parameters:
      - in: header
        name: X-Correlation-ID
        schema:
          type: string
        description: Optional request trace identifier; generated when absent.
      tags:
      - ready
      responses:
        '200':
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: Trace identifier for this response and its logs.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: ''
        '503':
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: Trace identifier for this response and its logs.
              required: true
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
components:
  schemas:
    DatabaseEnum:
      enum:
      - CONNECTED
      type: string
      description: '* `CONNECTED` - CONNECTED'
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        service:
          type: string
      required:
      - service
      - status
    HealthStatusEnum:
      enum:
      - UP
      type: string
      description: '* `UP` - UP'
    PaginatedRiskRuleList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RiskRule'
        next_cursor:
          type:
          - string
          - 'null'
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlation_id:
          type: string
      required:
      - code
      - correlation_id
      - detail
      - status
      - title
      - type
    Ready:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReadyStatusEnum'
        service:
          type: string
        database:
          $ref: '#/components/schemas/DatabaseEnum'
      required:
      - database
      - service
      - status
    ReadyStatusEnum:
      enum:
      - READY
      type: string
      description: '* `READY` - READY'
    RiskRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        parameters:
          readOnly: true
        enabled:
          type: boolean
          readOnly: true
        effective_at:
          type: string
          format: date-time
          readOnly: true
        revision:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - effective_at
      - enabled
      - id
      - name
      - parameters
      - revision
      - type
      - updated_at
    TypeEnum:
      enum:
      - AMOUNT_LIMIT
      - BLOCKLIST
      type: string
      description: |-
        * `AMOUNT_LIMIT` - Amount limit
        * `BLOCKLIST` - Blocklist
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
