services:
  s4-rsk-db:
    image: postgres:16-alpine
    container_name: s4-rsk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s4_rsk_db}
      POSTGRES_USER: ${POSTGRES_USER:-s4_rsk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-s4_rsk_password}
    ports:
      - "5434:5432" # Mapped to 5434 on host to avoid colliding with local Postgres
    volumes:
      - s4_rsk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-s4_rsk_user} -d ${POSTGRES_DB:-s4_rsk_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  s4-rsk:
    build: .
    container_name: s4-rsk
    restart: unless-stopped
    env_file:
      - s4_rsk/.env
    environment:
      POSTGRES_HOST: s4-rsk-db
      POSTGRES_PORT: 5432
      PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      s4-rsk-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  s4-rsk-frontend:
    build:
      context: ./frontend
    container_name: s4-rsk-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      s4-rsk:
        condition: service_healthy
volumes:
  s4_rsk_pgdata: